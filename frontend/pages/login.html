<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Haiti Reh-Care</title>
  <meta name="description" content="Connectez-vous à votre espace patient ou administrateur Haiti Reh-Care.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="../assets/img/logorecar.png?v=1" alt="Haiti Reh-Care">
      </div>
      
      <h2 style="text-align: center; margin-bottom: var(--space-2);">Connexion</h2>
      <p style="text-align: center; color: var(--clr-text-muted); font-size: var(--fs-small); margin-bottom: var(--space-6);">
        Accédez à votre espace patient ou administrateur
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email ou ID patient</label>
          <div class="search-input-wrapper">
            <i data-lucide="mail"></i>
            <input type="text" class="form-input search-input" id="email" name="email" placeholder="votre@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="search-input-wrapper">
            <i data-lucide="lock"></i>
            <input type="password" class="form-input search-input" id="password" name="password" placeholder="••••••••" required>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4);">
          <label class="checkbox-label" style="font-size: var(--fs-small);">
            <input type="checkbox" name="remember"> Se souvenir de moi
          </label>
          <a href="#" style="font-size: var(--fs-small);">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-pill" style="width: 100%; justify-content: center;">
          <i data-lucide="log-in"></i> Se connecter
        </button>
      </form>

      <div class="login-divider">ou</div>

      <div style="display: grid; gap: var(--space-2);">
        <a href="inscription-patient.html" class="btn btn-outline" style="width: 100%; justify-content: center;">
          <i data-lucide="user-plus"></i> Créer un compte patient
        </a>
        <a href="rendez-vous.html" class="btn btn-outline" style="width: 100%; justify-content: center;">
          <i data-lucide="calendar"></i> Prendre RDV sans compte
        </a>
      </div>

      <div style="text-align: center; margin-top: var(--space-6);">
        <a href="../index.html" style="font-size: var(--fs-small); color: var(--clr-text-muted);">
          <i data-lucide="arrow-left" style="width: 14px; height: 14px; display: inline; vertical-align: middle;"></i> 
          Retour au site
        </a>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    lucide.createIcons();
    
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const result = await api.login(email, password);
        
        if (result.access_token) {
          localStorage.setItem('hrc_token', result.access_token);
          localStorage.setItem('hrc_user', JSON.stringify(result.user));
          
          // Redirect based on role
          if (result.user.role === 'admin') {
            window.location.href = 'admin/dashboard.html';
          } else {
            window.location.href = 'suivi-patient.html';
          }
        } else {
          showToast('Erreur de connexion. Vérifiez vos identifiants.', 'error');
        }
      } catch (error) {
        showToast('Erreur de connexion. Veuillez réessayer.', 'error');
      }
    });
    
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <i data-lucide="${type === 'error' ? 'alert-circle' : 'info'}"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();
      
      setTimeout(() => {
        toast.remove();
      }, 4000);
    }
  </script>
</body>
</html>
